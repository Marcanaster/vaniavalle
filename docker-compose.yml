services:
  db:
    image: postgres:16-alpine
    container_name: dance_academy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: danceacademydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dance_academy_api
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=danceacademydb;Username=postgres;Password=supersecretpassword
    ports:
      - "5000:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dance_academy_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: